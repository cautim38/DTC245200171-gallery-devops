# Upstream Gallery App (Internal Docker Network)
upstream gallery_backend {
    server app:3000;
    keepalive 32;
}

# 1. Chuyển hướng toàn bộ HTTP (cổng 8080 của unprivileged container) sang HTTPS
server {
    listen 8080;
    server_name _;

    # Chuyển hướng an toàn 301 sang HTTPS
    return 301 https://$host$request_uri;
}

# 2. Virtual Host HTTPS chính (cổng 8443 của unprivileged container)
server {
    listen 8443 ssl;
    http2 on;
    server_name localhost _;

    # Cấu hình SSL / TLS (Hardening Biện pháp 3 & 5)
    ssl_certificate /etc/nginx/certs/gallery.crt;
    ssl_certificate_key /etc/nginx/certs/gallery.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ==============================================================================
    # SECURITY HEADERS (Hardening Biện pháp 5)
    # ==============================================================================
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self';" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Endpoint giám sát Nginx Stub Status (Dành cho nginx-prometheus-exporter)
    location /stub_status {
        stub_status;
        access_log off;
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
    }

    # Giới hạn tần suất đăng nhập chống brute-force (Hardening Biện pháp 10)
    location = /auth/login {
        limit_req zone=login_limit burst=5 nodelay;

        proxy_pass http://gallery_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Chặn thực thi mã nguy hiểm trong thư mục uploads (Hardening Biện pháp 9)
    location ~* ^/uploads/.*.(php|sh|pl|py|cgi|exe|bat|js)$ {
        deny all;
        return 403;
    }

    # Proxy mặc định đến Node.js App
    location / {
        limit_req zone=general_limit burst=20 nodelay;

        proxy_pass http://gallery_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
