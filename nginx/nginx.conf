# Nginx Configuration - Unprivileged User (Hardening Biện pháp 1)
pid /tmp/nginx.pid;
worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 2048;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Ẩn phiên bản Nginx trong response headers (Hardening Biện pháp 5)
    server_tokens off;

    # Cấu hình log định dạng JSON phục vụ Loki & Promtail truy vấn LogQL (Giai đoạn 3)
    log_format json_analytics escape=json '{'
        '"time_local":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"request_method":"$request_method",'
        '"request_uri":"$request_uri",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"http_referrer":"$http_referer",'
        '"http_user_agent":"$http_user_agent"'
    '}';

    access_log /var/log/nginx/access.log json_analytics;
    error_log /var/log/nginx/error.log warn;

    # Tối ưu hiệu năng gửi file
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Giới hạn kích thước tải lên (Hardening Biện pháp 9)
    client_max_body_size 25M;

    # Giới hạn tần suất request (Rate Limiting - Hardening Biện pháp 10)
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=general_limit:10m rate=30r/s;

    # Cấu hình gzip nén dữ liệu truyền tải
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml font/truetype application/x-font-ttf font/opentype application/vnd.ms-fontobject image/svg+xml;

    # Nạp các cấu hình virtual host
    include /etc/nginx/conf.d/*.conf;
}
